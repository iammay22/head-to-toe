<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>從頭相到腳</title>
<style>
:root{
  --bg:#f7e7ef; --card:#fffaf5; --text:#4a3b47; --line:#5e3a36;
  --gold:#c9a24b; --blue:#6b9fd6; --pink:#e88aa8; --mint:#bfe3d0; --radius:16px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif}
body{display:flex;flex-direction:column;min-height:100dvh;height:100dvh;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer;border:none;background:none}
header{display:flex;align-items:center;justify-content:space-between;padding:8px 14px;flex:none}
header h1{font-size:18px;letter-spacing:2px;cursor:pointer;padding:8px 6px 8px 0}
#mute{width:40px;height:40px;border-radius:50%;background:var(--card);font-size:18px}
main{flex:1;position:relative;min-height:0}
.screen{display:none;position:absolute;inset:0}
.screen.active{display:flex;flex-direction:column}
footer{text-align:center;font-size:12px;opacity:.7;padding:6px;flex:none}
.btn{display:block;width:100%;padding:14px;border:2px solid var(--gold);background:#fff;border-radius:14px;font-size:17px;font-weight:600}
.btn{box-shadow:0 4px 0 #b08d3e;transition:transform .06s,box-shadow .06s;position:relative}
.btn.main{background:var(--pink);border-color:var(--pink);color:#fff;box-shadow:0 4px 0 #c56a88}
.btn:active:not(:disabled){transform:translateY(4px);box-shadow:0 0 0 transparent}
.btn:disabled{box-shadow:0 4px 0 #d9cbb0}
.tabs button,.opt,.seg button,#mute,.zoom{box-shadow:0 3px 0 #e2ccd6;transition:transform .06s,box-shadow .06s}
.tabs button.on{box-shadow:0 3px 0 #2c222a}
.opt.on,.seg button.on{box-shadow:0 3px 0 #e3a3b8}
.tabs button:active,.opt:active,.seg button:active,#mute:active,.zoom:active{transform:translateY(3px);box-shadow:0 0 0 transparent}
.tabs{padding-bottom:11px}.bar{padding-bottom:12px}
.btn:disabled{opacity:.5}

/* 首頁 */
#home{align-items:center;justify-content:center;padding:24px;gap:14px;text-align:center}
#home .logo{font-size:44px;font-weight:800;letter-spacing:6px;line-height:1.25}
#home .logo span{color:var(--pink)}
#home p{line-height:1.7;max-width:320px}
#home .menu{width:100%;max-width:320px;display:flex;flex-direction:column;gap:12px;margin-top:10px}
#loading{font-size:14px;opacity:.7}

/* 捏人 */
#make .stage{flex:1;min-height:0;position:relative;background:linear-gradient(#fff6f0,#fde9ef);border-radius:var(--radius);margin:0 10px;overflow:hidden}
#view{width:100%;height:100%;display:block}
.chips{position:absolute;left:8px;top:8px;display:flex;flex-direction:column;gap:4px;font-size:12px;pointer-events:none}
.chips span{background:rgba(255,250,245,.9);border-radius:10px;padding:3px 8px;align-self:flex-start}
#handView{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:6px;background:rgba(255,246,240,.82);backdrop-filter:blur(2px);padding:44px 16px 16px}
#handView.on{display:flex}
#handView img{max-height:68%;max-width:80%;object-fit:contain;filter:drop-shadow(0 6px 10px rgba(120,80,90,.18));animation:pop .25s}
#handView b{font-size:18px}#handView small{font-size:13px;opacity:.75}
@keyframes pop{from{transform:scale(.9);opacity:0}to{transform:none;opacity:1}}
.zoom{position:absolute;right:8px;top:8px;background:rgba(255,250,245,.9);border-radius:12px;padding:6px 10px;font-size:13px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:8px 10px;flex:none;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:none;padding:8px 14px;border-radius:999px;background:var(--card);font-size:15px;min-height:40px}
.tabs button.on{background:var(--text);color:#fff}
.panel{height:32dvh;flex:none;overflow-y:auto;padding:2px 10px 8px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.opt{position:relative;background:var(--card);border:2px solid transparent;border-radius:14px;padding:6px 4px 8px;min-height:64px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:14px}
.opt.on{border-color:var(--pink);background:#fff}
.opt img{width:100%;height:44px;object-fit:contain;pointer-events:none}
.opt .ph{position:absolute;right:4px;top:3px;font-size:10px;background:var(--mint);border-radius:6px;padding:0 4px}
.opt small{font-size:11px;opacity:.65}
.sw{width:34px;height:34px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px #d9c7cf}
.group{margin:8px 2px 6px;font-size:13px;opacity:.75}
.slider{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:14px;padding:8px 12px;margin-bottom:8px}
.slider label{width:5.5em;font-size:14px;flex:none}
.slider input{flex:1;height:32px;accent-color:var(--pink)}
.slider small{width:4.5em;font-size:11px;opacity:.6;text-align:right;flex:none}
.note{font-size:12px;opacity:.7;margin:6px 2px;line-height:1.6}
.bar{display:flex;gap:8px;padding:8px 10px;flex:none}
.bar .btn{padding:12px 6px;flex:1;width:auto}
.bar .btn.main{flex:1.6}

/* 看相演出 */
#watch{background:rgba(74,59,71,.92);color:#fff;align-items:center;justify-content:center;gap:10px}
#watchView{width:min(86vw,380px);height:62dvh;background:linear-gradient(#fff6f0,#fde9ef);border-radius:var(--radius)}
#watch .say{display:flex;align-items:center;gap:10px;font-size:16px;min-height:60px}
#watch .say img{width:56px;height:56px}
#watch button{color:#fff;border:1px solid rgba(255,255,255,.6);border-radius:999px;padding:8px 22px}

/* 結果 */
#result{overflow-y:auto;padding:4px 14px 20px;display:none}
#result.active{display:block}
#result .title{text-align:center;margin:6px 0 10px}
#result .title small{display:block;font-size:15px;letter-spacing:4px;color:var(--gold)}
#result .title b{font-size:34px;letter-spacing:3px}
#cardImg{display:block;width:62%;max-width:300px;margin:0 auto 12px;border-radius:14px;box-shadow:0 6px 20px rgba(74,59,71,.18)}
.box{background:var(--card);border-radius:var(--radius);padding:14px;margin-bottom:10px;line-height:1.75;font-size:15px}
.box h3{font-size:14px;color:var(--gold);margin-bottom:4px;letter-spacing:2px}
.luck{display:grid;grid-template-columns:3em 6em 1fr;gap:2px 6px;align-items:baseline}
.luck .st{color:var(--gold);letter-spacing:1px;white-space:nowrap}
.luck .tx{font-size:13.5px}
details summary{font-size:15px;font-weight:600;min-height:36px;display:flex;align-items:center;justify-content:space-between;cursor:pointer;list-style:none}
details summary::-webkit-details-marker{display:none}
details summary::after{content:'點開看 ▾';font-size:13px;font-weight:400;color:var(--gold);background:#fff;border:1.5px solid var(--gold);border-radius:999px;padding:3px 10px}
details[open] summary::after{content:'收起 ▴'}
.read{display:grid;grid-template-columns:5.2em 1fr;gap:4px 8px;font-size:14px;margin-top:6px}
.read b{font-weight:600}
.read img{width:64px;height:64px;grid-column:1/3}
.acts{display:flex;flex-direction:column;gap:12px;margin-top:12px;padding-bottom:6px}
.acts .note{margin:0}.note:empty{display:none}

.sheet{position:fixed;inset:0;background:rgba(74,59,71,.5);display:none;align-items:flex-end;justify-content:center;z-index:20}
.sheet.on{display:flex}
.sheet .in{background:var(--bg);width:100%;max-width:520px;border-radius:20px 20px 0 0;padding:16px 16px calc(18px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:10px}
.seg{display:flex;gap:6px}.seg button{flex:1;padding:10px 4px;border-radius:12px;background:var(--card);border:2px solid transparent;font-size:15px;min-height:44px}.seg button.on{border-color:var(--pink);background:#fff}
input.txt{width:100%;padding:12px;border-radius:12px;border:2px solid #e6d3db;font:inherit;font-size:16px;background:#fff;color:var(--text)}
.linkrow{display:flex;gap:6px}.linkrow input{flex:1;font-size:13px;min-width:0}
#invite{align-items:center;justify-content:center;gap:12px;padding:20px;text-align:center;overflow-y:auto}
#inviteView{width:min(60vw,220px);height:36dvh;flex:none}
#pair,#dex{overflow-y:auto;padding:4px 14px 20px;display:none}#pair.active,#dex.active{display:block}
#pairView{width:100%;height:40dvh;display:block;background:linear-gradient(#fff6f0,#fde9ef);border-radius:var(--radius)}
.names{display:grid;grid-template-columns:1fr 1fr;text-align:center;font-weight:700;margin:8px 0 0}.names small{display:block;font-weight:400;font-size:12px;opacity:.7}
.score{text-align:center;margin:2px 0}.score b{font-size:68px;color:var(--pink);font-variant-numeric:tabular-nums}.score span{font-size:20px;margin-left:4px}
.rel{text-align:center;font-size:28px;font-weight:800;letter-spacing:3px;margin-bottom:8px}
.stamp{display:none;margin:4px auto 8px;width:max-content;border:3px solid #c0504d;color:#c0504d;padding:4px 14px;border-radius:8px;transform:rotate(-8deg);font-weight:800;letter-spacing:4px;font-size:20px}
.stamp.on{display:block;animation:stamp .35s ease-out}
@keyframes stamp{from{transform:rotate(-8deg) scale(2.4);opacity:0}to{transform:rotate(-8deg) scale(1);opacity:1}}
#lnView{width:100%;height:210px;display:block;border-radius:12px;background:linear-gradient(#fff6f0,#fde9ef);margin-top:4px}
.ln{display:flex;align-items:center;gap:8px;margin:6px 0;font-size:12px}.ln input{flex:1;accent-color:var(--gold);height:32px}.ln b{width:4em;text-align:right;font-size:15px}
.dexgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.dexitem{background:var(--card);border-radius:12px;padding:8px 6px;font-size:13px;text-align:center;min-height:64px;display:flex;flex-direction:column;justify-content:center;gap:2px}
.dexitem.lock{opacity:.45}.dexitem.lock img{filter:grayscale(1)}.dexitem img{height:38px;object-fit:contain}.dexitem small{font-size:11px;opacity:.75;line-height:1.45}
.dextop{display:flex;align-items:center;gap:10px;margin:4px 0 8px}
.bhud{display:flex;gap:6px 10px;flex-wrap:wrap;align-items:center;padding:0 12px 6px;font-size:13px;flex:none}.bhud b{font-size:15px;margin-right:auto}
.bstage{flex:1;min-height:150px;position:relative;margin:0 10px;border-radius:var(--radius);overflow:hidden}
#bView{width:100%;height:100%;display:block}
.bsign{position:absolute;left:8px;top:8px;background:rgba(255,250,245,.9);border-radius:10px;padding:3px 9px;font-size:13px;font-weight:600}
.bprop{position:absolute;right:10px;top:6px;font-size:40px}
.spot{position:absolute;transform:translate(-50%,-50%);min-width:26px;height:24px;padding:0 6px;border-radius:12px;background:rgba(232,138,168,.92);color:#fff;font-size:12px;font-weight:700;border:2px solid #fff;box-shadow:0 2px 0 rgba(74,59,71,.25);white-space:nowrap}
.spot:disabled{opacity:.55}.spot.sel{background:var(--text);opacity:1}.spot.best{background:var(--gold);opacity:1}
.spot.hand{left:10px;bottom:10%;top:auto;transform:none;height:auto;padding:4px 8px;display:flex;flex-direction:column;align-items:center;background:rgba(255,250,245,.95);color:var(--text)}
.spot.hand img{width:44px;height:44px}.spot.hand.sel{background:#e9dde3;border-color:var(--text)}.spot.hand.best{background:#f6e7b8;border-color:var(--gold)}
.bdialog{flex:none;padding:10px 12px 12px;display:flex;flex-direction:column;gap:8px;max-height:52dvh;overflow-y:auto}
.insp{display:flex;gap:10px;align-items:center;background:#fff;border:2px solid var(--pink);border-radius:12px;padding:8px 10px;font-size:14px;line-height:1.55}.insp img{width:56px;height:42px;object-fit:contain;flex:none}
.linkbtn{font-size:13.5px;color:var(--text);opacity:.75;text-decoration:underline;padding:6px;align-self:center}
.spot.seen:not(.sel):not(.best){background:rgba(150,120,140,.9)}
.rankbtn{width:34px;height:34px;border-radius:50%;background:var(--card);font-size:16px;box-shadow:0 3px 0 #e2ccd6}
#rankList{overflow-y:auto;max-height:50dvh;display:flex;flex-direction:column;gap:5px}
.rk{display:grid;grid-template-columns:2.2em 1fr auto auto;gap:8px;align-items:center;background:var(--card);border-radius:10px;padding:8px 10px;font-size:14px}
.rk.me{background:#fff;border:2px solid var(--pink)}.rk b{text-align:center}.rk small{font-size:10.5px;background:var(--mint);border-radius:6px;padding:0 5px;margin-left:5px}.rk.me small{background:var(--pink);color:#fff}
.rk em{font-style:normal;font-size:12px;opacity:.7}.rk i{font-style:normal;font-weight:700;color:var(--gold);font-variant-numeric:tabular-nums}
.subtabs{display:flex;gap:6px;overflow-x:auto;margin:2px 0 10px;padding-bottom:4px;scrollbar-width:none}
.subtabs button{flex:none;padding:7px 14px;border-radius:10px;background:var(--card);font-size:14px;border:2px solid transparent;box-shadow:0 3px 0 #e2ccd6}.subtabs button.soon{opacity:.55}.subtabs button.on{border-color:var(--gold);background:#fff}
.bline{background:var(--card);border-radius:14px;padding:10px 12px;font-size:15.5px;line-height:1.6}
#bOpts{display:flex;flex-direction:column;gap:11px;padding-bottom:5px}#bOpts:empty{display:none}#bOpts .btn{padding:11px;font-size:15.5px}
.adv{display:flex;gap:8px}.adv .btn{flex:1;padding:12px 2px!important}
.fb{border-radius:12px;padding:8px 10px;font-size:13.5px;line-height:1.6;margin-bottom:6px}.fb.ok{background:#e4f3e6}.fb.ng{background:#fbe9e6}
.gain{text-align:center;font-weight:700;color:var(--gold);font-size:16px}.lvup{text-align:center;font-weight:700;color:var(--pink);margin-top:4px}
#bNext{margin-bottom:5px}
@media (min-width:820px){#booth{max-width:560px;margin:0 auto;width:100%}
  body{max-width:1080px;margin:0 auto}
  #make.active{display:grid;grid-template-columns:1fr 420px;grid-template-rows:auto 1fr auto;column-gap:6px}
  #make .stage{grid-row:1/4;margin:0 0 8px 10px}
  .panel{height:auto;min-height:0}
  #result{max-width:560px;margin:0 auto}
}
</style>
</head>
<body>
<header><h1 id="homeLink" role="button" tabindex="0">從頭相到腳</h1><button id="mute" aria-label="聲音開關">🔔</button></header>
<main>
  <section class="screen active" id="home">
    <div class="logo">從頭<span>相</span>到腳</div>
    <p>捏一個從頭到腳的角色，讓相師傅看看這張臉、這副身形藏了什麼運。</p>
    <div class="menu">
      <button class="btn main" id="startBtn" disabled>開始捏人</button>
      <button class="btn" id="boothBtn" disabled>🔒 相士攤位（看相一次後開放）</button>
      <button class="btn" id="dexBtn" disabled>🔒 圖鑑（看相一次後開放）</button>
    </div>
    <div id="loading">素材準備中…</div>
  </section>

  <section class="screen" id="make">
    <div class="stage">
      <canvas id="view"></canvas>
      <div id="handView"></div>
      <div class="chips" id="chips"></div>
      <button class="zoom" id="zoomBtn">看全身</button>
    </div>
    <div class="tabs" id="tabs"></div>
    <div class="panel" id="panel"></div>
    <div class="bar">
      <button class="btn" id="randBtn">隨機</button>
      <button class="btn" id="undoBtn">復原</button>
      <button class="btn main" id="readBtn">看相</button>
    </div>
  </section>

  <section class="screen" id="watch">
    <canvas id="watchView"></canvas>
    <div class="say"><img id="masterImg" alt=""><span id="sayText">讓我看看…</span></div>
    <button id="skipBtn">略過</button>
  </section>

  <section class="screen" id="result">
    <div class="title"><small id="rPrefix"></small><b id="rName"></b><div class="note" id="rHidden"></div></div>
    <button class="btn main" id="pairGo" style="display:none;margin-bottom:12px">看合盤結果</button>
    <img id="cardImg" alt="結果卡">
    <div class="note" style="text-align:center">長按圖片也可以直接存下來</div>
    <div class="box"><h3>總評</h3><div id="rSummary"></div></div>
    <div class="box"><h3>四運</h3><div class="luck" id="rLuck"></div></div>
    <div class="box"><h3>發運時期</h3><div id="rPeriod"></div></div>
    <div class="box"><h3>流年</h3><canvas id="lnView"></canvas>
      <div class="ln"><span>15</span><input type="range" id="lnAge" min="15" max="75" step="1" value="25"><span>75</span><b id="lnAgeTx">25 歲</b></div>
      <div id="lnText" style="font-size:14.5px"></div></div>
    <div class="box"><details><summary>各部位怎麼看</summary><div class="read" id="rRead"></div></details></div>
    <div class="note" id="rJoke"></div>
    <div class="acts">
      <button class="btn main" id="saveBtn">存結果卡</button>
      <button class="btn" id="pairBtn">找人合盤</button>
      <button class="btn" id="backBtn">回去改</button>
    </div>
  </section>

  <section class="screen" id="invite">
    <canvas id="inviteView"></canvas>
    <h2 id="invTitle" style="font-size:24px"></h2>
    <div id="invRel"></div>
    <p style="line-height:1.7;max-width:300px">對方的稱號先蓋著。你捏完自己、看完相，就會看到你們合不合。</p>
    <input class="txt" id="invNick" maxlength="8" placeholder="你的暱稱（可以不填）" style="max-width:320px">
    <button class="btn main" id="invStart" style="max-width:320px">開始捏我自己</button>
  </section>

  <section class="screen" id="pair">
    <div class="title" style="text-align:center;margin:6px 0"><small style="color:var(--gold);letter-spacing:4px" id="pRel"></small></div>
    <canvas id="pairView"></canvas>
    <div class="names"><div><span id="pNameA"></span><small id="pTitleA"></small></div><div><span id="pNameB"></span><small id="pTitleB"></small></div></div>
    <div class="score"><b id="pScore">10</b><span>分</span></div>
    <div class="rel" id="pTitle"></div>
    <div class="stamp" id="pStamp">此盤稀有</div>
    <div class="note" id="pQuip" style="text-align:center"></div>
    <div class="box"><h3>亮點</h3><div id="pHigh"></div></div>
    <div class="box"><h3>磨合點</h3><div id="pLow"></div></div>
    <div class="acts">
      <button class="btn main" id="pSave">存雙人卡</button>
      <button class="btn" id="pReturn">傳回給對方</button>
      <div class="linkrow" id="pLinkRow" style="display:none"><input class="txt" id="pLink" readonly></div>
      <div class="note" id="pMsg"></div>
      <button class="btn" id="pBack">回我的結果</button>
      <button class="btn" id="pMine">我也來捏一個</button>
      <button class="btn" id="pHome">回首頁</button>
    </div>
  </section>

  <section class="screen" id="booth">
    <div class="bhud"><b id="bName"></b><span id="bRep"></span><span id="bCoin"></span><span id="bNo"></span><button id="bRank" class="rankbtn" aria-label="排行榜">🏆</button></div>
    <div class="bstage" id="bStage"><canvas id="bView"></canvas><div id="bSpots"></div><div class="bsign" id="bSign"></div><div class="bprop" id="bProp"></div></div>
    <div class="bdialog"><div class="bline" id="bLine"></div><div class="note" id="bStep"></div><div id="bOpts"></div><div id="bFeed"></div><button class="btn main" id="bNext" style="display:none">下一位</button></div>
  </section>

  <section class="screen" id="dex">
    <div class="dextop"><button class="btn" id="dexBack" style="width:auto;padding:8px 14px">← 返回</button><h2 style="font-size:20px">圖鑑</h2></div>
    <div class="tabs" id="dexTabs" style="padding:0 0 8px"></div>
    <div id="dexBody"></div>
  </section>
</main>
<div class="sheet" id="rankSheet"><div class="in" style="max-height:86dvh">
  <div style="display:flex;justify-content:space-between;align-items:center"><b style="font-size:18px">🏆 相士排行榜</b><button id="rankClose" style="font-size:22px;width:40px;height:40px">×</button></div>
  <div class="linkrow"><input class="txt" id="rankNick" maxlength="8" placeholder="取個相士名號"><button class="btn" id="rankSave" style="width:auto;padding:10px 14px">改名</button></div>
  <div id="rankList"></div>
  <div class="note" id="rankMsg" style="margin:0"></div>
</div></div>
<div class="sheet" id="pairSheet"><div class="in">
  <div style="display:flex;justify-content:space-between;align-items:center"><b style="font-size:18px">找人合盤</b><button id="sheetClose" style="font-size:22px;width:40px;height:40px">×</button></div>
  <div class="note" style="margin:0">傳連結給對方，對方捏完角色，就能看到你們合不合。</div>
  <div class="group" style="margin:0">你們的關係</div>
  <div class="seg" id="relSeg"></div>

  const t0 = performance.now(), dur = 620; let last = -1;

    if (i !== last && i < 4) { snd.wood(); last = i; }

const ENC_VER = 1;

  const b = [ENC_VER];
  ENC_PARTS.forEach(k => b.push(c[k] || 0));   // stance 已停用，位置留著讓舊連結能開
  SLIDERS.forEach(s => b.push(Math.round(c[s.id] / 5)));

    ENC_PARTS.forEach(k => { const v = b[i++]; if (PARTS[k]) c[k] = fit(v, PARTS[k].options.length); });

}

  const ex = PARTS.face.options[x.face].el, ey = PARTS.face.options[y.face].el;
  if (ex === '鵝蛋臉' && ey === '鵝蛋臉') { part.el = 15; hi.push([2, PAIR_TEXT.bothOval]); }
  else if (ex === '鵝蛋臉' || ey === '鵝蛋臉') { part.el = 15; hi.push([2, PAIR_TEXT.oval(ex === '鵝蛋臉' ? nx : ny)]); }

  if (jy.weak === jx.main) { part.comp += 10; hi.push([1, PAIR_TEXT.complement(nx, FORT_NAME[jx.main], ny)]); }

  const same = ENC_PARTS.slice(0, 7).filter(k => x[k] === y[k]);
  part.common = Math.min(16, same.length * 4);
  if (same.length) hi.push([3, PAIR_TEXT.common(PARTS[same[0]].options[x[same[0]]].name)]);

  const hx = jx.hidden && jx.hidden.id, hy = jy.hidden && jy.hidden.id;

  else if ((hx === 'general' && hy === 'strategist') || (hx === 'strategist' && hy === 'general')) egg = 'duo';

    const d = jx.stars[i] - jy.stars[i];

  $('bStep').textContent = ''; $('bOpts').innerHTML = '';
  $('bFeed').innerHTML = '<div class="fb ' + (okP ? 'ok' : 'ng') + '">' + (okP ? '✓' : '✗') + ' 看' + fname + '，這位客人最該看' + SPOT_LABEL[bp] + '：' + o.name + '，' + o.text + '。</div>' +
    '<div class="fb ' + (okA ? 'ok' : 'ng') + '">' + (okA ? '✓' : '✗') + ' ' + fname + (fs.length > 1 ? '平均 ' : ' ') + starStr(st) + '，' + ADV_WHY[want] + '</div>' +
    boothReward([5, 15, 30][n], [0, 1, 3][n], n === 2);
  n === 2 ? snd.coin() : snd.hmm(); boothNextBtn();
}
function finishGuest(i) {
  const g = bs.list[bs.i].guest, ok = i === g.ans, b = boothStore();
  bs.phase = 'done';
  $('bLine').textContent = '「' + (ok ? g.good : g.bad) + '」'; $('bStep').textContent = ''; $('bOpts').innerHTML = '';
  if (ok && !b.guests.includes(g.id)) b.guests.push(g.id);
  $('bFeed').innerHTML = '<div class="fb ' + (ok ? 'ok' : 'ng') + '">' + (ok ? '✓ 「' + g.name + '」收進圖鑑了。' : '✗ 這位客人改天還會再來。') + '</div>' + boothReward(ok ? 50 : 10, ok ? 5 : 1, ok);
  ok ? snd.coin() : snd.hmm(); boothNextBtn(); requestAnimationFrame(paintBooth);
}
function boothNextBtn() { boothHud(); $('bNext').textContent = bs.i < 4 ? '下一位' : '收攤'; $('bNext').style.display = 'block'; }
function endDay() {
  const b = boothStore(); b.days++; persist(); track('booth_day_end', bs.right);
  const lvl = boothLevel(b.rep), next = BOOTH_LEVELS[lvl + 1];
  bs.i = 5; bs.phase = 'end'; bs.lvl = lvl; boothHud();
  const cv = $('bView'); cv.getContext('2d').clearRect(0, 0, cv.width, cv.height);
  $('bSpots').innerHTML = ''; $('bProp').textContent = '🌙';
  $('bLine').innerHTML = '今天收攤了。看了 5 位客人，完全看準 ' + bs.right + ' 位。<br>賺到 ' + bs.coins + ' 枚銅板，口碑 +' + bs.rep + '。'; $('bStep').textContent = '';
  $('bFeed').innerHTML = '<div class="note">目前排在第 ' + myRank() + ' 名。' + (next ? '口碑再 ' + (next.need - b.rep) + ' 點，就能升級成「' + next.name + '」。' : '你已經是名人御用的相師傅了。') + '看不準的時候，去圖鑑翻翻各部位的解讀。</div>';
  $('bOpts').innerHTML = '<button class="btn main" data-day="1">再開一天</button><button class="btn" data-rank="1">🏆 看排行榜</button><button class="btn" data-home="1">回首頁</button>';
  submitScore();
  $('bNext').style.display = 'none';
}
function inspectHtml(c, k) {
  const o = PARTS[k].options[c[k]], aid = DEX_ASSET[k] && DEX_ASSET[k](o);
  return '<div class="insp">' + (aid && IT[aid] ? '<img src="' + IT[aid].src + '" alt="">' : '') + '<div><b>' + SPOT_LABEL[k] + '・' + o.name + '</b><br>' + o.text + '</div></div>';
}
function showPartStep() {
  const c = bs.list[bs.i].c; bs.phase = 'part';
  $('bStep').textContent = '第一步：點客人身上的部位看看。可以多看幾個，再決定這題要看哪裡。';
  $('bOpts').innerHTML = bs.sel ? inspectHtml(c, bs.sel) + '<button class="btn main" data-confirm="1">這題就看' + SPOT_LABEL[bs.sel] + '</button>' : '';
  bs.looked = bs.looked || {}; if (bs.sel) bs.looked[bs.sel] = 1;
  requestAnimationFrame(paintBooth);
}
$('bSpots').addEventListener('click', e => {
  const b = e.target.closest('.spot'); if (!b || bs.phase !== 'part') return;
  bs.sel = b.dataset.p; snd.wood(); showPartStep();
});
$('bOpts').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.confirm && bs.phase === 'part' && bs.sel) {
    const c = bs.list[bs.i].c; bs.phase = 'advice'; snd.pop();
    $('bStep').textContent = '你決定看' + SPOT_LABEL[bs.sel] + '（' + PARTS[bs.sel].options[c[bs.sel]].name + '）。第二步：給他什麼建議？';
    $('bOpts').innerHTML = '<div class="adv">' + ADVICE.map((t, i) => '<button class="btn" data-a="' + i + '">' + t + '</button>').join('') + '</div><button class="linkbtn" data-back="1">← 重新看部位</button>';
    requestAnimationFrame(paintBooth);
  }
  else if (b.dataset.back && bs.phase === 'advice') { snd.tick(); showPartStep(); }
  else if (b.dataset.rank) openRank();
  else if (b.dataset.a !== undefined && bs.phase === 'advice') finishNormal(+b.dataset.a);
  else if (b.dataset.g !== undefined && bs.phase === 'guest') finishGuest(+b.dataset.g);
  else if (b.dataset.day) startDay();
  else if (b.dataset.home) { go('home'); refreshHome(); }
});
/* ---------- 排行榜 ---------- */
// 街坊相士是遊戲裡的角色，讓榜上一開始就有對手；接上試算表後，其他玩家會排進來
const NPC_RANK = [['王半仙', 168], ['柳婆婆', 121], ['阿福師', 84], ['小鐵口', 47], ['豆花伯', 22], ['新來的阿明', 6]];
function myId() { if (!store.pid) { store.pid = Math.random().toString(36).slice(2, 12) + Date.now().toString(36); persist(); } return store.pid; }
function rankRows(remote) {
  const me = {id: myId(), name: store.nick || '無名相士', rep: boothStore().rep, me: true};
  const rows = NPC_RANK.map(n => ({name: n[0], rep: n[1], npc: true})).concat((remote || []).filter(r => r.id !== me.id).map(r => ({name: cleanName(r.name) || '無名相士', rep: +r.rep || 0})), [me]);
  return rows.sort((a, b) => b.rep - a.rep || (a.me ? -1 : 1));
}
function myRank(remote) { return rankRows(remote).findIndex(r => r.me) + 1; }
function renderRank(remote) {
  const rows = rankRows(remote), mine = rows.findIndex(r => r.me);
  $('rankList').innerHTML = rows.slice(0, 30).map((r, i) => '<div class="rk' + (r.me ? ' me' : '') + '"><b>' + (i < 3 ? ['🥇', '🥈', '🥉'][i] : i + 1) + '</b><span>' + r.name + (r.npc ? '<small>街坊</small>' : r.me ? '<small>你</small>' : '') + '</span><em>' + BOOTH_LEVELS[boothLevel(r.rep)].name + '</em><i>口碑 ' + r.rep + '</i></div>').join('') +
    (mine >= 30 ? '<div class="rk me"><b>' + (mine + 1) + '</b><span>' + rows[mine].name + '<small>你</small></span><em></em><i>口碑 ' + rows[mine].rep + '</i></div>' : '');
}
async function openRank() {
  $('rankNick').value = store.nick || ''; $('rankMsg').textContent = '標「街坊」的是遊戲裡的相士。'; renderRank(); $('rankSheet').classList.add('on');
  if (!ENDPOINT) return;
  try { const j = await (await fetch(ENDPOINT + '?action=top')).json(); renderRank(j.rows || []); $('rankMsg').textContent = '標「街坊」的是遊戲裡的相士。目前有 ' + (j.total || 0) + ' 位玩家上榜。'; }
  catch (e) { $('rankMsg').textContent = '線上排行榜暫時連不上，先顯示街坊相士和你。'; }
}
function submitScore() {
  if (!ENDPOINT) return;
  const b = boothStore(), body = JSON.stringify({event: 'booth_score', id: myId(), name: store.nick || '無名相士', rep: b.rep, coins: b.coins, days: b.days});
  try { navigator.sendBeacon ? navigator.sendBeacon(ENDPOINT, body) : fetch(ENDPOINT, {method: 'POST', mode: 'no-cors', body}); } catch (e) {}
}
$('bRank').onclick = openRank;
$('rankClose').onclick = () => $('rankSheet').classList.remove('on');
$('rankSheet').addEventListener('click', e => { if (e.target.id === 'rankSheet') $('rankSheet').classList.remove('on'); });
$('rankSave').onclick = () => { store.nick = cleanName($('rankNick').value); persist(); snd.pop(); renderRank(); submitScore(); };
$('bNext').onclick = () => { if (bs.i < 4) { bs.i++; showCustomer(); } else endDay(); };
$('boothBtn').onclick = () => { snd.init(); snd.bgm(true); startDay(); };
addEventListener('resize', () => { if ($('booth').classList.contains('active') && bs && bs.i < 5) paintBooth(); });

checkCopy();
loadImages().then(() => {
  $('masterImg').src = IT.master.src; $('loading').textContent = ''; $('startBtn').disabled = false; refreshHome();
  pairCtx = readHash();
  if (pairCtx && pairCtx.mode === 'invite') showInvite();
  else if (pairCtx) { track('pair_open', pairCtx.r); showPair(); }
});
addEventListener('hashchange', () => { const c = readHash(); if (!c) return; pairCtx = c; c.mode === 'invite' ? showInvite() : showPair(); });
</script>
